<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cards com Paginação e Open Finance</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Meus Cartões e Open Finance</h1>
    </header>

    <section id="cards-section">
        <div class="card">
            <h2>Cartão 1</h2>
            <p>Informações sobre o cartão 1.</p>
        </div>
        <div class="card">
            <h2>Cartão 2</h2>
            <p>Informações sobre o cartão 2.</p>
        </div>
        <div class="card">
            <h2>Cartão 3</h2>
            <p>Informações sobre o cartão 3.</p>
        </div>
        <!-- Adicione mais cartões conforme necessário -->
    </section>

    <div id="pagination">
        <button id="prev-page">Anterior</button>
        <span id="page-info">Página 1 de 3</span>
        <button id="next-page">Próxima</button>
    </div>

    <section id="open-finance-section">
        <h2>Open Finance</h2>
        <p>Integração com Open Finance para compartilhamento de dados financeiros.</p>
        <button id="connect-open-finance">Conectar ao Open Finance</button>
    </section>

    <script src="scripts.js"></script>
</body>
</html>
